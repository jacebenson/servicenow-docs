name: Indexing checks
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/verify-indexing.py
      - name: Verify Nginx redirects behind TLS and serves real 404s
        run: |
          docker run -d --name indexing-nginx -p 8088:80 -v "$PWD/_site:/usr/share/nginx/html:ro" -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8088/sitemap.xml >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/docs/gliderecord/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/access/accesscontrols)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/access/beforequerybusinessrules/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/this-page-does-not-exist)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/tags/stub/)" = 404
          # Model Coolify's TLS proxy: Nginx receives HTTP with an HTTPS forwarded scheme.
          assert_redirect() {
            source_path="$1"
            expected_location="$2"
            headers=$(curl --silent --show-error --dump-header - --output /dev/null -H 'Host: sn.jace.pro' -H 'X-Forwarded-Proto: https' "http://localhost:8088$source_path" | tr -d '\r')
            printf '%s\n' "$headers" | grep -q '^HTTP/1.1 301 '
            printf '%s\n' "$headers" | grep -Fx "Location: $expected_location"
          }
          assert_redirect /access/accesscontrols /access/access-controls/
          assert_redirect /access/accesscontrols/ /access/access-controls/
          assert_redirect '/access/beforequerybusinessrules/?ref=legacy' '/access/before-query-business-rules/?ref=legacy'
          assert_redirect '/docs/gliderecord?ref=legacy' '/docs/gliderecord/?ref=legacy'
