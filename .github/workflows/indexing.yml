name: Indexing checks
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/verify-indexing.py
      - name: Verify Nginx serves sitemap and real 404s
        run: |
          docker run -d --name indexing-nginx -p 8088:80 -v "$PWD/_site:/usr/share/nginx/html:ro" -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8088/sitemap.xml >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/docs/gliderecord/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/this-page-does-not-exist)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/tags/stub/)" = 404
