server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Coolify. Keep redirects relative so browsers preserve HTTPS.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Preserve links to renamed access-control documentation.
    location ~ ^/access/accesscontrols/?$ {
        return 301 /access/access-controls/$is_args$args;
    }
    location ~ ^/access/beforequerybusinessrules/?$ {
        return 301 /access/before-query-business-rules/$is_args$args;
    }

    # Static documentation: missing pages must return 404, not the homepage.
    location / {
        try_files $uri $uri/ =404;
    }
}
